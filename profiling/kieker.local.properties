# Local Kieker config for component-level profiling of the TeaStore unit-test suite.
# Replicates the paper's local/component measurement (per-method execution time via Kieker),
# but writes plain-text .dat records to a LOCAL directory instead of the production AMQP/RabbitMQ
# path — so no broker is needed. The per-iteration output directory is injected on the command
# line via -Dkieker.monitoring.writer.filesystem.FileWriter.customStoragePath=<dir>.

kieker.monitoring.name=TeaStoreProfile
kieker.monitoring.enabled=true
kieker.monitoring.metadata=true
kieker.monitoring.hostname=
kieker.monitoring.initialExperimentId=1

# Timer: nanosecond wall-clock (execution time = tout - tin, in ns).
kieker.monitoring.timer=kieker.monitoring.timer.SystemNanoTimer
kieker.monitoring.timer.SystemNanoTimer.unit=0

# Writer: filesystem, human-readable text records (so the parser is robust and inspectable).
kieker.monitoring.writer=kieker.monitoring.writer.filesystem.FileWriter
kieker.monitoring.writer.filesystem.FileWriter.customStoragePath=
kieker.monitoring.writer.filesystem.FileWriter.logStreamHandler=kieker.monitoring.writer.filesystem.TextLogStreamHandler
kieker.monitoring.writer.filesystem.FileWriter.charsetName=UTF-8
kieker.monitoring.writer.filesystem.FileWriter.maxEntriesInFile=2000000
kieker.monitoring.writer.filesystem.FileWriter.maxLogSize=-1
kieker.monitoring.writer.filesystem.FileWriter.maxLogFiles=-1
kieker.monitoring.writer.filesystem.FileWriter.flush=true
kieker.monitoring.writer.filesystem.FileWriter.bufferSize=8192
# Writer queue — restored from upstream TeaStore's own kieker.monitoring.properties, which sets
# all three; our from-scratch config dropped them and silently inherited Kieker's defaults.
# QueueFullBehavior=0 is BLOCK: when the writer cannot keep up, the application thread waits
# rather than the record being discarded. That is the only acceptable setting for a measurement
# run — a dropped record does not announce itself, it just quietly biases the sample toward
# whatever was cheap enough to record, which is exactly backwards for regression detection.
kieker.monitoring.writer.filesystem.FileWriter.QueueSize=10000
kieker.monitoring.writer.filesystem.FileWriter.PrioritizedQueueSize=100
kieker.monitoring.writer.filesystem.FileWriter.QueueFullBehavior=0
